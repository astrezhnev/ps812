<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Three panels. A sample space rectangle holds nine pebbles, two of them outside events A and B. The pebbles outside B are then discarded. Finally B alone is enlarged, its four remaining pebbles grown so their mass sums to one." font-family="Red Hat Text, sans-serif">
<title>Conditioning in pebble world</title>
<defs>
<clipPath id="clipB3"><circle cx="995" cy="170" r="132"/></clipPath>
</defs>

<!-- Panel 1: the whole sample space -->
<rect x="12" y="18" width="386" height="284" rx="6" fill="none" stroke="#777777" stroke-width="1.5"/>
<text x="26" y="42" font-size="18" fill="#777777">&#937;</text>
<circle cx="144" cy="170" r="100" fill="#0479A8" fill-opacity="0.13" stroke="#0479A8" stroke-width="2"/>
<circle cx="266" cy="170" r="100" fill="#c5050c" fill-opacity="0.13" stroke="#c5050c" stroke-width="2"/>
<g fill="#333333">
<circle cx="85" cy="190" r="9"/>
<circle cx="120" cy="235" r="9"/>
<circle cx="155" cy="110" r="9"/>
<circle cx="205" cy="140" r="9"/>
<circle cx="205" cy="200" r="9"/>
<circle cx="290" cy="235" r="9"/>
<circle cx="325" cy="195" r="9"/>
<circle cx="48" cy="272" r="9"/>
<circle cx="365" cy="48" r="9"/>
</g>
<text x="80" y="112" text-anchor="middle" font-size="23" font-weight="700" fill="#0479A8">A</text>
<text x="330" y="112" text-anchor="middle" font-size="23" font-weight="700" fill="#c5050c">B</text>

<!-- Panel 2: the pebbles outside B are gone, the sample space is unchanged -->
<rect x="407" y="18" width="386" height="284" rx="6" fill="none" stroke="#777777" stroke-width="1.5"/>
<text x="421" y="42" font-size="18" fill="#777777">&#937;</text>
<circle cx="539" cy="170" r="100" fill="#0479A8" fill-opacity="0.13" stroke="#0479A8" stroke-width="2"/>
<circle cx="661" cy="170" r="100" fill="#c5050c" fill-opacity="0.13" stroke="#c5050c" stroke-width="2"/>
<g fill="#333333">
<circle cx="600" cy="140" r="9"/>
<circle cx="600" cy="200" r="9"/>
<circle cx="685" cy="235" r="9"/>
<circle cx="720" cy="195" r="9"/>
</g>
<text x="475" y="112" text-anchor="middle" font-size="23" font-weight="700" fill="#0479A8">A</text>
<text x="725" y="112" text-anchor="middle" font-size="23" font-weight="700" fill="#c5050c">B</text>

<!-- Panel 3: B is now the sample space, so it carries the heavy outline and
     no box of its own - everything outside it has been discarded. -->
<circle cx="995" cy="170" r="132" fill="#c5050c" fill-opacity="0.13"/>
<circle cx="833.96" cy="170" r="132" fill="#0479A8" fill-opacity="0.13" clip-path="url(#clipB3)"/>
<circle cx="833.96" cy="170" r="132" fill="none" stroke="#0479A8" stroke-width="2" clip-path="url(#clipB3)"/>
<circle cx="995" cy="170" r="132" fill="none" stroke="#c5050c" stroke-width="3.5"/>
<g fill="#333333">
<circle cx="914.48" cy="130.4" r="14"/>
<circle cx="914.48" cy="209.6" r="14"/>
<circle cx="1026.68" cy="255.8" r="14"/>
<circle cx="1072.88" cy="203" r="14"/>
</g>
<text x="914" y="95" text-anchor="middle" font-size="23" font-weight="700" fill="#0479A8">A</text>
<text x="1075" y="90" text-anchor="middle" font-size="23" font-weight="700" fill="#c5050c">B</text>
</svg>
