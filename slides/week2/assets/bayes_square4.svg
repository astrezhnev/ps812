  <rect x="250" y="55" width="360" height="360" fill="none" stroke="#bbbbbb" stroke-width="3"/>
  <line x1="358" y1="55" x2="358" y2="415" stroke="#bbbbbb" stroke-width="3"/>
</g>
<line x1="278" y1="265" x2="326" y2="265" stroke="#333333" stroke-width="2"/>
<path d="M 342 265 L 324 257 L 324 273 Z" fill="#333333"/>
