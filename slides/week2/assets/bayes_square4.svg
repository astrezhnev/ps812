<rect x="631" y="225" width="214" height="80" fill="#c5050c" fill-opacity="0.50" stroke="#c5050c" stroke-width="2"/>
<text x="493" y="212" text-anchor="middle" font-size="19" font-weight="700" fill="#6A3D9A">P(B | A) P(A)</text>
<text x="738" y="212" text-anchor="middle" font-size="19" font-weight="700" fill="#c5050c">P(B | A<tspan font-size="13" dy="-7">c</tspan><tspan dy="7">)</tspan> P(A<tspan font-size="13" dy="-7">c</tspan><tspan dy="7">)</tspan></text>
<text x="493" y="337" text-anchor="middle" font-size="25" font-weight="700" fill="#6A3D9A">P(A | B)</text>
<text x="738" y="337" text-anchor="middle" font-size="25" font-weight="700" fill="#c5050c">P(A<tspan font-size="16" dy="-9">c</tspan><tspan dy="9">&#160;| B)</tspan></text>
