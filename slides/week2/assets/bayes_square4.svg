<g transform="translate(-82.5,134.75) scale(0.55)">
  <rect x="250" y="55" width="360" height="360" fill="#000000" fill-opacity="0.03"/>
  <rect x="250" y="199" width="108" height="216" fill="#6A3D9A" fill-opacity="0.55" stroke="#6A3D9A" stroke-width="4"/>
