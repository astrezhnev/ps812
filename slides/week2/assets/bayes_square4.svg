<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="The two blocks that make up B are divided by P(B) and laid out as a single bar of width one. The purple share of that bar is the posterior probability of A given B." font-family="Red Hat Text, sans-serif">
