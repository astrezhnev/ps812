<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 262" role="img" aria-label="Three Venn panels showing that the probability of A and B factors into the probability of landing in B, times the probability of landing in A once already inside B." font-family="Red Hat Text, sans-serif">
<title>Factoring a joint probability into conditionals</title>
