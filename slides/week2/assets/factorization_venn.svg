<circle cx="145" cy="110" r="72" fill="#0479A8" fill-opacity="0.1" stroke="#0479A8" stroke-width="2"/>
<circle cx="235" cy="110" r="72" fill="#c5050c" fill-opacity="0.45" stroke="#c5050c" stroke-width="2"/>
<text x="102" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#0479A8">A</text><text x="278" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#c5050c">B</text>
<text x="190" y="242" text-anchor="middle" font-size="26" font-weight="700" fill="#c5050c">P(B)</text>
<rect x="450" y="20" width="300" height="180" rx="6" fill="none" stroke="#777777" stroke-width="1.5"/><text x="464" y="44" font-size="18" fill="#777777">&#937;</text>
<circle cx="555" cy="110" r="72" fill="#0479A8" fill-opacity="0.1" stroke="#0479A8" stroke-width="2"/>
<circle cx="645" cy="110" r="72" fill="#c5050c" fill-opacity="0.13" stroke="#c5050c" stroke-width="2"/>
<circle cx="555" cy="110" r="72" fill="#6A3D9A" fill-opacity="0.55" clip-path="url(#b1)"/>
<path d="M450 20 H750 V200 H450 Z M573 110 a 72 72 0 1 0 144 0 a 72 72 0 1 0 -144 0 Z" fill-rule="evenodd" fill="#9a9a9a" fill-opacity="0.38"/>
<text x="512" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#0479A8">A</text><text x="688" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#c5050c">B</text>
<text x="600" y="242" text-anchor="middle" font-size="26" font-weight="700" fill="#6A3D9A">P(A | B)</text>
<rect x="860" y="20" width="300" height="180" rx="6" fill="none" stroke="#777777" stroke-width="1.5"/><text x="874" y="44" font-size="18" fill="#777777">&#937;</text>
<circle cx="965" cy="110" r="72" fill="#0479A8" fill-opacity="0.1" stroke="#0479A8" stroke-width="2"/>
<circle cx="1055" cy="110" r="72" fill="#c5050c" fill-opacity="0.13" stroke="#c5050c" stroke-width="2"/>
<circle cx="965" cy="110" r="72" fill="#6A3D9A" fill-opacity="0.55" clip-path="url(#b2)"/>
<text x="922" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#0479A8">A</text><text x="1098" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#c5050c">B</text>
<text x="1010" y="242" text-anchor="middle" font-size="26" font-weight="700" fill="#6A3D9A">P(A &#8745; B)</text>
