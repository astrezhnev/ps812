<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="A sample space rectangle holds six pebbles, s1 through s6. Arrows labelled X carry each pebble down to a point on the real number line: s1 to 0, s2 and s3 to 1, s4 to 2, s5 and s6 to 4. No pebble lands on 3." font-family="Red Hat Text, sans-serif">
<title>A random variable maps outcomes to numbers</title>
<defs>
<marker id="arrowX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#c5050c"/>
</marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#555555"/>
</marker>
</defs>

<!-- The sample space -->
<rect x="150" y="16" width="700" height="148" rx="6" fill="none" stroke="#777777" stroke-width="1.5"/>
<text x="164" y="40" font-size="18" fill="#777777">&#937;</text>
<g fill="#333333">
<circle cx="230" cy="100" r="11"/>
<circle cx="340" cy="75" r="11"/>
<circle cx="425" cy="120" r="11"/>
<circle cx="530" cy="85" r="11"/>
<circle cx="680" cy="115" r="11"/>
<circle cx="770" cy="70" r="11"/>
</g>
<g font-size="19" font-style="italic" fill="#555555">
<text x="246" y="106">s<tspan font-size="13" dy="5">1</tspan></text>
<text x="356" y="81">s<tspan font-size="13" dy="5">2</tspan></text>
<text x="441" y="126">s<tspan font-size="13" dy="5">3</tspan></text>
<text x="546" y="91">s<tspan font-size="13" dy="5">4</tspan></text>
<text x="696" y="121">s<tspan font-size="13" dy="5">5</tspan></text>
<text x="786" y="76">s<tspan font-size="13" dy="5">6</tspan></text>
</g>

<!-- X sends every pebble to exactly one number; several can share a number -->
<g fill="none" stroke="#c5050c" stroke-width="2.2" marker-end="url(#arrowX)">
<path d="M230 113 Q212 210 200 318"/>
<path d="M340 88 Q350 200 342 318"/>
<path d="M425 133 Q380 220 358 318"/>
<path d="M530 98 Q512 210 500 318"/>
<path d="M680 128 Q770 220 792 318"/>
<path d="M770 83 Q820 200 808 318"/>
</g>
<text x="118" y="236" text-anchor="middle" font-size="30" font-style="italic" font-weight="700" fill="#c5050c">X</text>

<!-- The real line -->
<line x1="70" y1="334" x2="930" y2="334" stroke="#555555" stroke-width="2" marker-start="url(#arrowR)" marker-end="url(#arrowR)"/>
<g stroke="#555555" stroke-width="2">
<line x1="200" y1="324" x2="200" y2="344"/>
<line x1="350" y1="324" x2="350" y2="344"/>
<line x1="500" y1="324" x2="500" y2="344"/>
<line x1="650" y1="324" x2="650" y2="344"/>
<line x1="800" y1="324" x2="800" y2="344"/>
</g>
<g font-size="22" fill="#333333" text-anchor="middle">
<text x="200" y="372">0</text>
<text x="350" y="372">1</text>
<text x="500" y="372">2</text>
<text x="650" y="372">3</text>
<text x="800" y="372">4</text>
</g>
<text x="940" y="372" text-anchor="middle" font-size="22" font-weight="700" fill="#555555">&#8477;</text>
</svg>
